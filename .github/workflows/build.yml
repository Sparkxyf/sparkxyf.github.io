name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy site
        run: npm run build

      - name: Copy original image assets
        run: |
          mkdir -p dist/img
          if [ -d src/site/img ]; then
            cp -R src/site/img/. dist/img/
          fi

      - name: Disable Jekyll for static output
        run: touch dist/.nojekyll

      - name: Verify generated site and image assets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const fail = (message, details = []) => {
            console.error(message);
            for (const detail of details) console.error(`- ${detail}`);
            process.exit(1);
          };

          const exists = (file) => fs.existsSync(file);
          const read = (file) => fs.readFileSync(file, "utf8");
          const stripResourcePath = (value) => value.trim().replace(/^<|>$/g, "").split(/[?#]/)[0];
          const decodeUrlPath = (urlPath) => urlPath
            .split("/")
            .map((part) => {
              try {
                return decodeURIComponent(part);
              } catch {
                return part;
              }
            })
            .join("/");
          const pathVariants = (urlPath) => [...new Set([urlPath, decodeUrlPath(urlPath)])];
          const walk = (dir, predicate = () => true) => {
            const results = [];
            if (!exists(dir)) return results;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) results.push(...walk(fullPath, predicate));
              else if (entry.isFile() && predicate(fullPath)) results.push(fullPath);
            }
            return results;
          };

          const requiredFiles = [
            "dist/index.html",
            "dist/styles/digital-garden-base.css",
            "dist/styles/custom-style.css",
          ];
          const missingRequired = requiredFiles.filter((file) => !exists(file));
          if (missingRequired.length) fail("Missing required generated files:", missingRequired);

          const indexHtml = read("dist/index.html");
          if (!indexHtml.includes("/styles/digital-garden-base.css")) {
            fail("The homepage was not generated with the Digital Garden template.");
          }
          if (indexHtml.includes("Jekyll v")) {
            fail("The generated homepage unexpectedly contains GitHub/Jekyll output.");
          }

          const sourceImages = walk("src/site/img", (file) => /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(file));
          const missingCopiedImages = sourceImages
            .map((file) => path.relative("src/site/img", file))
            .filter((relative) => !exists(path.join("dist/img", relative)));
          if (missingCopiedImages.length) {
            fail("Image files exist in src/site/img but were not copied to dist/img:", missingCopiedImages);
          }

          const noteFiles = walk("src/site/notes", (file) => file.endsWith(".md"));
          const unresolvedNoteImages = [];
          for (const note of noteFiles) {
            const markdown = read(note);
            const noteDir = path.dirname(note);
            for (const match of markdown.matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)) {
              const rawUrl = stripResourcePath(match[1]);
              if (!rawUrl || /^(https?:|data:)/i.test(rawUrl)) continue;

              const candidates = [];
              for (const localUrl of pathVariants(rawUrl)) {
                if (localUrl.startsWith("/img/")) {
                  candidates.push(path.join("src/site", localUrl));
                  candidates.push(path.join("dist", localUrl));
                } else if (localUrl.startsWith("img/")) {
                  candidates.push(path.join("src/site", localUrl));
                  candidates.push(path.join("dist", localUrl));
                } else {
                  candidates.push(path.join(noteDir, localUrl));
                  const relativeNoteDir = path.relative("src/site/notes", noteDir);
                  candidates.push(path.join("src/site/img/user", relativeNoteDir, localUrl));
                  candidates.push(path.join("dist/img/user", relativeNoteDir, localUrl));
                }
              }

              if (!candidates.some(exists)) unresolvedNoteImages.push(`${note}: ${rawUrl}`);
            }
          }
          if (unresolvedNoteImages.length) {
            fail("Markdown image references do not resolve to source or dist assets:", unresolvedNoteImages);
          }

          const htmlFiles = walk("dist", (file) => file.endsWith(".html"));
          const refs = new Set();
          for (const file of htmlFiles) {
            const html = read(file);
            for (const match of html.matchAll(/\b(?:src|href)=["'](\/img\/[^"']+)["']/g)) {
              refs.add(stripResourcePath(match[1]));
            }
            for (const match of html.matchAll(/\bsrcset=["']([^"']+)["']/g)) {
              for (const candidate of match[1].split(",")) {
                const url = candidate.trim().split(/\s+/)[0];
                if (url.startsWith("/img/")) refs.add(stripResourcePath(url));
              }
            }
          }

          const missingReferencedImages = [...refs].filter((ref) =>
            !pathVariants(ref).some((localRef) => exists(path.join("dist", localRef)))
          );
          if (missingReferencedImages.length) {
            fail("Generated HTML references missing image assets:", missingReferencedImages);
          }

          console.log(`Verified ${htmlFiles.length} HTML file(s), ${sourceImages.length} source image(s), and ${refs.size} generated image reference(s).`);
          NODE

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live Pages deployment
        run: |
          set -euo pipefail
          site_url="${{ steps.deployment.outputs.page_url }}"
          site_root="${site_url%/}/"
          home_html="$(mktemp)"
          sitemap_xml="$(mktemp)"
          page_html="$(mktemp)"

          curl --fail --location --retry 10 --retry-delay 6 --retry-all-errors "$site_root" --output "$home_html"
          curl --fail --location --retry 10 --retry-delay 6 --retry-all-errors "${site_root}sitemap.xml" --output "$sitemap_xml"

          page_url="$(python3 - "$sitemap_xml" "$site_root" <<'PY'
          import re
          import sys
          from urllib.parse import quote, urljoin, urlparse, urlunparse

          sitemap_path, site_url = sys.argv[1], sys.argv[2].rstrip("/") + "/"
          with open(sitemap_path, encoding="utf-8") as file:
              urls = re.findall(r"<loc>(.*?)</loc>", file.read())

          for url in urls:
              absolute_url = urljoin(site_url, url)
              page_path = urlparse(absolute_url).path.rstrip("/")
              if page_path and page_path != "/404":
                  parsed = urlparse(absolute_url)
                  print(urlunparse(parsed._replace(path=quote(parsed.path, safe="/%"), fragment="")))
                  break
          PY
          )"
          if [ -n "$page_url" ]; then
            curl --fail --location --retry 10 --retry-delay 6 --retry-all-errors "$page_url" --output "$page_html"
          fi

          html_to_check=("$home_html")
          if [ -s "$page_html" ]; then
            html_to_check+=("$page_html")
          fi

          if grep -q "Jekyll v" "${html_to_check[@]}"; then
            echo "Live site is still being served by GitHub/Jekyll instead of the Eleventy artifact." >&2
            exit 1
          fi

          if ! grep -q "/styles/digital-garden-base.css" "$home_html"; then
            echo "Live homepage does not contain the Digital Garden template CSS." >&2
            exit 1
          fi

          image_url="$(python3 - "$site_root" "$home_html" "$page_html" <<'PY'
          import re
          import sys
          from urllib.parse import quote, urljoin, urlparse, urlunparse

          site_url = sys.argv[1]
          for html_path in sys.argv[2:]:
              try:
                  with open(html_path, encoding="utf-8") as file:
                      html = file.read()
              except OSError:
                  continue

              for ref in re.findall(r'\b(?:src|href)=["\'](/img/[^"\']+)["\']', html):
                  raw_url = urljoin(site_url, ref.split("?", 1)[0].split("#", 1)[0])
                  parsed = urlparse(raw_url)
                  print(urlunparse(parsed._replace(path=quote(parsed.path, safe="/%"), fragment="")))
                  raise SystemExit
          PY
          )"
          if [ -n "$image_url" ]; then
            curl --fail --location --retry 10 --retry-delay 6 --retry-all-errors "$image_url" --output /tmp/site-image
          else
            echo "No live /img/ references found to verify."
          fi
