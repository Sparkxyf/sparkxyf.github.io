name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Eleventy site
        run: npm run build

      - name: Copy original image assets
        run: |
          mkdir -p dist/img
          cp -R src/site/img/. dist/img/

      - name: Disable Jekyll for static output
        run: touch dist/.nojekyll

      - name: Verify image assets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const htmlFiles = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (entry.isFile() && fullPath.endsWith(".html")) {
                htmlFiles.push(fullPath);
              }
            }
          };

          walk("dist");

          const refs = new Set();
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, "utf8");
            for (const match of html.matchAll(/\b(?:src|href)=["'](\/img\/[^"']+)["']/g)) {
              refs.add(match[1].split(/[?#]/)[0]);
            }
            for (const match of html.matchAll(/\bsrcset=["']([^"']+)["']/g)) {
              for (const candidate of match[1].split(",")) {
                const url = candidate.trim().split(/\s+/)[0];
                if (url.startsWith("/img/")) {
                  refs.add(url.split(/[?#]/)[0]);
                }
              }
            }
          }

          const missing = [...refs].filter((ref) => !fs.existsSync(path.join("dist", ref)));
          if (missing.length) {
            console.error("Missing image assets:");
            for (const ref of missing) console.error(`- ${ref}`);
            process.exit(1);
          }

          console.log(`Verified ${refs.size} image asset reference(s).`);
          NODE

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
